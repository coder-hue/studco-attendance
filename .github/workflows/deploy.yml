name: Deploy attendance site

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: attendance-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$remote" "mkdir -p '$DEPLOY_PATH/app' '$DEPLOY_PATH/database' '$DEPLOY_PATH/scripts'"
          rsync -az -e "ssh -p $DEPLOY_PORT" --exclude='.env' --exclude='.env.discord' public/ "$remote:$DEPLOY_PATH/"
          rsync -az -e "ssh -p $DEPLOY_PORT" app/ "$remote:$DEPLOY_PATH/app/"
          rsync -az -e "ssh -p $DEPLOY_PORT" database/ "$remote:$DEPLOY_PATH/database/"
          rsync -az -e "ssh -p $DEPLOY_PORT" scripts/ "$remote:$DEPLOY_PATH/scripts/"
          ssh -p "$DEPLOY_PORT" "$remote" "cd '$DEPLOY_PATH' && php scripts/install.php --migrate-only"
